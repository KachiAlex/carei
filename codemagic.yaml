workflows:
  ios-app-store:
    name: iOS App Store build
    instance_type: mac_mini_m1
    max_build_duration: 90
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.carei.app
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
      node: latest
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - node_modules
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS (copies web assets, runs pod install)
        script: npx cap sync ios
      - name: Build and sign IPA
        working_directory: ios/App
        script: |
          xcode-project use-profiles
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
